services:
  backend:
    build: ./backend
    container_name: doc-agent
    ports:
      - "8081:8081"
    env_file:
      - ./backend/app/.env
    depends_on:
      - redis
    volumes:
      - ./serviceAccountKey.json:/app/app/serviceAccountKey.json:ro
       
    

  redis:
    image: redis:7-alpine
    container_name: redis-agent
    ports:
      - "6379:6379"
    env_file:
      - ./backend/app/.env
    volumes:
      - redis_data:/data

volumes:
  redis_data:
